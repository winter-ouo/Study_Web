<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>StudyTrophy - 數據分析</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav>
        <a href="index.html">📅 課表進度</a>
        <a href="tomato.html">🍅 番茄鐘</a>
        <a href="stats.html">📊 數據分析</a>
    </nav>

    <div id="current-week-info"
        style="background: #ebf8ff; border: 1px solid #bee3f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; color: #2b6cb0;">
        <button onclick="changeWeek(-1)"
            style="padding:6px 12px; cursor:pointer; background: #3182ce; color: white; border: none; border-radius: 4px; font-weight: bold;">◀
            上一週</button>
        <span id="week-range-text" style="margin: 0 15px; font-weight:bold; font-size:1.1rem;">📅 數據引擎載入中...</span>
        <button onclick="changeWeek(1)"
            style="padding:6px 12px; cursor:pointer; background: #3182ce; color: white; border: none; border-radius: 4px; font-weight: bold;">下一週
            ▶</button>
        <button id="return-this-week-btn" onclick="resetToThisWeek()"
            style="margin-left:10px; font-size:0.8rem; padding:4px 8px; cursor:pointer; background: #e2e8f0; color: #4a5568; border: none; border-radius: 4px; display: none;">返回本週</button>
    </div>

    <div class="container" style="display: block; max-width: 800px; margin: 0 auto;">
        <section class="schedule-section" style="width: 100%; box-sizing: border-box;">
            <h2>📊 本週專注時數統計</h2>
            <h3 id="total-info" style="color: #2d3748; margin-bottom: 20px;">本週總計專注：0 分鐘</h3>

            <div style="position: relative; width: 100%; height: 400px;">
                <canvas id="weeklyChart"></canvas>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/stats.js"></script>
</body>

</html>
