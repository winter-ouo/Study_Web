<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>StudyTrophy - 管理中心</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav>
        <a href="index.html">📅 課表進度</a>
        <a href="tomato.html">🍅 番茄鐘</a>
        <a href="stats.html">📊 數據分析</a>
    </nav>

    <div id="current-week-info"
        style="background:#e8f4fd; color:#2b6cb0; padding:12px; border-radius:8px; margin-bottom:20px; text-align:center; font-size:1.1rem; border:1px solid #bee3f8;">
        載入時間引擎中...
    </div>

    <div class="container">
        <section class="schedule-section">

            <div style="text-align: right; margin-bottom: 15px;">
                <button onclick="toggleSetupPanel()"
                    style="background:#4a5568; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">
                    ⚙️ 修改課表時間與學期設定
                </button>
            </div>

            <div id="time-engine-panel" class="setup-panel"
                style="display: none; background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:20px; font-size:0.85rem; line-height: 2; border: 1px solid #e2e8f0;">
                <strong style="font-size:0.95rem; color:#2d3748;">⚙️ 課表自訂時間計算引擎 (手動鍵入)</strong>
                <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:10px;">

                    <div>學期週數：
                        <input type="number" id="setup-weeks" style="width:60px; padding:4px;" min="1" max="50"> 週
                    </div>

                    <div>開學日期：
                        <input type="date" id="setup-start-date" style="padding:4px;">
                    </div>

                    <div>每日節次：
                        <input type="number" id="engine-slots" style="width:60px; padding:4px;" min="1" max="24"> 節
                    </div>

                    <div>第一節始於：
                        <input type="time" id="engine-start" style="padding:4px;">
                    </div>

                    <div>上課長度：
                        <input type="number" id="engine-class-len" style="width:60px; padding:4px;" min="1"> 分鐘
                    </div>

                    <div>下課休息：
                        <input type="number" id="engine-rest-len" style="width:60px; padding:4px;" min="0"> 分鐘
                    </div>

                    <div>午休安排在：第
                        <input type="number" id="engine-noon-slot" style="width:60px; padding:4px;" min="1"> 節後
                    </div>

                    <div>午休時間：
                        <input type="number" id="engine-noon-len" style="width:60px; padding:4px;" min="0"> 分鐘
                    </div>

                </div>
                <div style="margin-top: 10px; display: flex; justify-content: space-between;">
                    <button onclick="restoreDefaultEngineSettings()"
                        style="background:#e53e3e; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">↩️
                        回復預設</button>
                    <div>
                        <button onclick="saveSemesterSettings(); updateTimeEngine();"
                            style="background:#3182ce; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">套用並儲存</button>
                        <button onclick="toggleSetupPanel()"
                            style="background:#a0aec0; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:5px;">取消關閉</button>
                    </div>
                </div>
            </div>

            <h2>📅 互動式課表</h2>
            <table>
                <thead>
                    <tr id="schedule-table-head">
                        <th>節次 / 時間</th>
                        <th>一</th>
                        <th>二</th>
                        <th>三</th>
                        <th>四</th>
                        <th>五</th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </section>

        <section class="trophy-section">
            <h2>🏆 獎盃牆</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn-add" onclick="showAddSubjectModal()">＋ 新增科目目標</button>
                <button class="btn-add" onclick="showAddEventModal()" style="background: #2b8a3e;">📅 新增行事曆提醒</button>
            </div>

            <div id="trophy-grid" class="trophy-grid"></div>

            <div class="admin-controls" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <button onclick="clearStudyLogs()" class="btn-outline">🗑️ 清除讀書紀錄</button>
                <button onclick="resetEverything()" class="btn-danger">⚠️ 重設整個系統</button>
            </div>
        </section>
    </div>

    <div id="add-modal" class="modal" style="display:none;">
        <h3>新增科目目標</h3>
        <label>選擇科目 (來自課表):</label><br>
        <select id="new-subject-name" style="width:100%; padding:8px;"></select><br><br>
        <input type="text" id="new-subject-start" placeholder="起始 (如: 1 或 第一章)"><br><br>
        <input type="text" id="new-subject-end" placeholder="目標 (如: 70 或 第五章)"><br><br>
        <button onclick="addSubject()">儲存目標</button>
        <button onclick="hideModals()">取消</button>
    </div>

    <div id="event-modal" class="modal" style="display:none;">
        <h3>📅 新增行事曆提醒</h3>
        <label>選擇星期：</label><br>
        <select id="event-day" style="width:100%; padding:8px;">
            <option value="1">週一</option>
            <option value="2">週二</option>
            <option value="3">週三</option>
            <option value="4">週四</option>
            <option value="5">週五</option>
        </select><br><br>
        <label>選擇節次：</label><br>
        <select id="event-slot" style="width:100%; padding:8px;"></select><br><br>
        <label>提醒事件內容：</label><br>
        <input type="text" id="event-note" placeholder="例如：14:00 考微積分" style="width:93%;"><br><br>
        <button onclick="addCalendarEvent()" style="background: #2b8a3e; color: white;">儲存提醒</button>
        <button onclick="hideModals()">取消</button>
    </div>

    <script src="js/main.js"></script>
    <script>
        function toggleSetupPanel() {
            const panel = document.getElementById('time-engine-panel');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // 把資料庫的數值載入到輸入框中
        function loadSettingsToInputs() {
            document.getElementById('setup-weeks').value = studyData.settings.totalWeeks;
            document.getElementById('setup-start-date').value = studyData.settings.startDate;
            document.getElementById('engine-slots').value = studyData.settings.totalSlots;
            document.getElementById('engine-start').value = studyData.settings.startTime;
            document.getElementById('engine-class-len').value = studyData.settings.classDuration;
            document.getElementById('engine-rest-len').value = studyData.settings.restDuration;
            document.getElementById('engine-noon-slot').value = studyData.settings.noonSlot;
            document.getElementById('engine-noon-len').value = studyData.settings.noonDuration;
        }

        window.onload = () => {
            loadSettingsToInputs();
            initSchedule();
            renderTrophies();
        };
    </script>
</body>

</html>
