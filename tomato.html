<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>StudyTrophy - 專注中心</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tomato-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #e74c3c;
            color: white;
        }

        .mode-btn.timer-active {
            background: #3182ce;
            color: white;
        }

        .timer-display {
            font-size: 4.5rem;
            font-weight: bold;
            font-family: monospace;
            margin: 20px 0;
            color: #2d3748;
        }

        .control-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 8px;
            color: white;
            transition: background 0.2s;
        }

        .btn-start {
            background: #38a169;
        }

        .btn-start:hover {
            background: #2f855a;
        }

        .btn-pause {
            background: #ecc94b;
            color: #744210;
        }

        .btn-pause:hover {
            background: #d69e2e;
        }

        .btn-reset {
            background: #e53e3e;
        }

        .btn-reset:hover {
            background: #c53030;
        }

        .setup-group {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #e2e8f0;
            text-align: left;
        }

        .setup-group label {
            font-weight: bold;
            color: #4a5568;
            display: block;
            margin-bottom: 8px;
        }

        /* 調整選單與刪除按鈕並排的佈局 */
        .selector-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            flex: 1;
            padding: 11px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
        }

        .btn-delete-item {
            background: #fff5f5;
            color: #e53e3e;
            border: 1px solid #fed7d7;
            padding: 11px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.15s;
            display: none;
            /* 預設隱藏，只有選到可刪除的自訂項目才秀出來 */
        }

        .btn-delete-item:hover {
            background: #e53e3e;
            color: white;
            border-color: #e53e3e;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">📅 課表進度</a>
        <a href="tomato.html" style="color: #e74c3c;">🍅 番茄鐘</a>
        <a href="stats.html">📊 數據分析</a>
    </nav>

    <div class="tomato-container">
        <div class="mode-selector">
            <button id="mode-pomodoro" class="mode-btn active" onclick="switchMode('pomo')">🍅 倒數番茄鐘</button>
            <button id="mode-stopwatch" class="mode-btn" onclick="switchMode('stopwatch')">⏱️ 自由計時器</button>
        </div>

        <h2 id="timer-title" style="color: #2d3748; margin: 0;">保持專注，衝刺吧！</h2>

        <div id="time-string" class="timer-display">25:00</div>

        <div>
            <button id="btn-main" class="control-btn btn-start" onclick="toggleTimer()">開始專注</button>
            <button id="btn-reset" class="control-btn btn-reset" onclick="resetTimer()">放棄</button>
        </div>

        <div class="setup-group">
            <label>📚 選擇本次專注科目：</label>
            <div class="selector-row">
                <select id="subject-selector" onchange="handleDropdownChange()">
                </select>
                <button id="btn-del-custom" class="btn-delete-item" onclick="deleteActiveCustomOption()">🗑️
                    刪除項目</button>
            </div>
        </div>
    </div>

    <script src="js/tomato.js"></script>
</body>

</html>
