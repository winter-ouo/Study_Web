<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>StudyTrophy - 管理中心</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .lunch-break-row {
            background-color: rgba(0, 0, 0, 0.03);
            color: #718096;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            height: 35px;
        }

        .lunch-break-row td {
            border-top: 1px dashed rgba(0, 0, 0, 0.08) !important;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08) !important;
            border-left: none !important;
            border-right: none !important;
            pointer-events: none;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">📅 課表進度</a>
        <a href="tomato.html">🍅 番茄鐘</a>
        <a href="stats.html">📊 數據分析</a>
    </nav>

    <div id="current-week-info"
        style="background:#e8f4fd; color:#2b6cb0; padding:12px; border-radius:8px; margin-bottom:20px; text-align:center; border:1px solid #bee3f8;">
        載入時間引擎中...
    </div>

    <div class="container">
        <section class="schedule-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div id="current-mode-status" style="font-weight: bold; color: #4a5568;">
                    目前的課表模式：📌 預設 13 節課時間表
                </div>
                <div>
                    <button onclick="toggleSetupPanel()"
                        style="background:#4a5568; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">
                        ⚙️ 修改進階時間與自訂設定
                    </button>
                </div>
            </div>

            <div id="time-engine-panel" class="setup-panel"
                style="display: none; background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:20px; font-size:0.85rem; line-height: 2; border: 1px solid #e2e8f0;">
                <strong style="font-size:0.95rem; color:#2d3748;">⚙️ 課表自訂時間計算引擎 (手動鍵入)</strong>
                <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:10px;">
                    <div>每日節次：<input type="number" id="engine-slots" style="width:60px; padding:4px;"> 節</div>
                    <div>第一節始於：<input type="time" id="engine-start" style="padding:4px;"></div>
                    <div>上課長度：<input type="number" id="engine-class-len" style="width:60px; padding:4px;"> 分鐘</div>
                    <div>下課休息：<input type="number" id="engine-rest-len" style="width:60px; padding:4px;"> 分鐘</div>
                    <div>午休安排在：第 <input type="number" id="engine-noon-slot" style="width:60px; padding:4px;"> 節後</div>
                    <div>午休時間：<input type="number" id="engine-noon-len" style="width:60px; padding:4px;"> 分鐘</div>
                </div>
                <div style="margin-top: 15px; display: flex; justify-content: space-between;">
                    <button onclick="useSystemDefaultMode()"
                        style="background:#e53e3e; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">↩️
                        回復並使用「預設課表模式」</button>
                    <div>
                        <button onclick="updateTimeEngineToCustom();"
                            style="background:#3182ce; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">套用自訂模式</button>
                        <button onclick="toggleSetupPanel()"
                            style="background:#a0aec0; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:5px;">取消關閉</button>
                    </div>
                </div>
            </div>

            <h2>📅 互動式課表</h2>
            <table>
                <thead>
                    <tr id="schedule-table-head">
                        <th>節次 / 時間</th>
                        <th>一</th>
                        <th>二</th>
                        <th>三</th>
                        <th>四</th>
                        <th>五</th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </section>

        <section class="trophy-section">
            <h2>🏆 獎盃牆</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn-add" onclick="showAddSubjectModal()">＋ 新增科目目標</button>
                <button class="btn-add" onclick="showAddEventModal()" style="background: #2b8a3e;">📅 新增行事曆事件</button>
            </div>

            <div id="trophy-grid" class="trophy-grid"></div>

            <div class="event-list-container">
                <h3 style="margin: 0 0 10px 0; color: #2d3748; font-size: 1rem;">📅 排程時間軸儀表板 (點擊管理)</h3>
                <div id="global-event-list" style="max-height: 280px; overflow-y: auto;"></div>
            </div>

            <div class="admin-controls" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <button onclick="clearStudyLogs()" class="btn-outline">🗑️ 清除讀書紀錄</button>
                <button onclick="resetEverything()" class="btn-danger">⚠️ 重設整個系統</button>
            </div>
        </section>
    </div>

    <div id="custom-click-menu" class="custom-click-menu">
        <div class="click-menu-item" onclick="handleContextAction('pin')">📌 <span id="ctx-pin-text">置頂排程</span></div>
        <div class="click-menu-item" onclick="handleContextAction('edit')">📝 編輯排程</div>
        <div class="click-menu-item danger-action" onclick="handleContextAction('delete')">🗑️ 刪除排程</div>
    </div>

    <div id="add-modal" class="modal" style="display:none;">
        <h3>新增科目目標</h3>
        <select id="new-subject-name" style="width:100%; padding:8px;"></select><br><br>
        <input type="text" id="new-subject-start" placeholder="起始進度"><br><br>
        <input type="text" id="new-subject-end" placeholder="目標進度"><br><br>
        <button onclick="addSubject()">儲存目標</button>
        <button onclick="hideModals()">取消</button>
    </div>

    <div id="event-modal" class="modal" style="display:none;">
        <h3 id="event-modal-title">📅 新增行事曆事件</h3>
        <input type="hidden" id="editing-event-id">
        <label>選擇日期：</label><br>
        <input type="date" id="event-date" style="width:93%; padding:8px; margin-bottom:12px;"><br>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>開始時間：</label><br>
                <input type="time" id="event-start-time" style="width:85%; padding:8px; margin-bottom:12px;">
            </div>
            <div style="flex: 1;">
                <label>結束時間：</label><br>
                <input type="time" id="event-end-time" style="width:85%; padding:8px; margin-bottom:12px;">
            </div>
        </div>
        <label>事件內容：</label><br>
        <input type="text" id="event-note" style="width:93%; padding:8px; margin-bottom:12px;"><br>

        <label>自訂標籤顏色：</label>
        <div class="color-picker-row" style="margin-bottom: 20px;">
            <div class="color-dot" data-color="#e53e3e" style="background:#e53e3e;"
                onclick="selectModalColor('#e53e3e')" title="珊瑚紅"></div>
            <div class="color-dot" data-color="#dd6b20" style="background:#dd6b20;"
                onclick="selectModalColor('#dd6b20')" title="琥珀橙"></div>
            <div class="color-dot" data-color="#319795" style="background:#319795;"
                onclick="selectModalColor('#319795')" title="松石綠"></div>
            <div class="color-dot" data-color="#4299e1" style="background:#4299e1;"
                onclick="selectModalColor('#4299e1')" title="莫蘭迪藍"></div>
            <div class="color-dot" data-color="#805ad5" style="background:#805ad5;"
                onclick="selectModalColor('#805ad5')" title="浪漫紫"></div>
        </div>

        <button onclick="addCalendarEvent()" style="background: #2b8a3e; color: white;">儲存排程</button>
        <button onclick="hideModals()">取消</button>
    </div>

    <script src="js/main.js"></script>
    <script>
        function toggleSetupPanel() {
            const panel = document.getElementById('time-engine-panel');
            panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
        }
        window.onload = () => {
            if (studyData.settings.customSettings) {
                document.getElementById('engine-slots').value = studyData.settings.customSettings.totalSlots;
                document.getElementById('engine-start').value = studyData.settings.customSettings.startTime;
                document.getElementById('engine-class-len').value = studyData.settings.customSettings.classDuration;
                document.getElementById('engine-rest-len').value = studyData.settings.customSettings.restDuration;
                document.getElementById('engine-noon-slot').value = studyData.settings.customSettings.noonSlot;
                document.getElementById('engine-noon-len').value = studyData.settings.customSettings.noonDuration;
            }
            initSchedule(); renderTrophies(); renderGlobalEventList();
            document.getElementById('current-mode-status').innerText = studyData.settings.isCustomMode ? "目前的課表模式：🛠️ 自訂計算模式" : "目前的課表模式：📌 預設 13 節課時間表";
        };
    </script>
</body>

</html>
